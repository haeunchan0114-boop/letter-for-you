<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 사랑하는 우주에게</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="space-background">
        <div class="space-moon"></div>
        <div class="nebula-pink"></div>
        <div class="nebula-blue"></div>
        <div class="nebula-purple"></div>
        
        <div class="aurora-green"></div>
        <div class="aurora-purple"></div>
        <div class="aurora-blue"></div>
        <div class="star-universe"></div>
        
        <div class="star-bright star1">✦</div>
        <div class="star-bright star2">✦</div>
        <div class="star-bright star3">✦</div>
        <div class="star-bright star4">✦</div>
        <div class="star-bright star5">✦</div>
        <div class="star-bright star6">✦</div>

        <div class="shooting-star s-star1"></div>
        <div class="shooting-star s-star2"></div>
        <div class="shooting-star s-star3"></div>
        <div class="shooting-star s-star4"></div>
        <div class="shooting-star s-star5"></div>
        <div class="shooting-star s-star6"></div>
        <div class="shooting-star s-star7"></div>
    </div>

    <div id="wrap">
        <h1>나의 사랑하는<br><span style="font-size: inherit; letter-spacing: inherit;">우주에게</span></h1>

        <div class="main-console-box">
            
            <button id="opt-toggle-btn" onclick="toggleOptimization()" class="winter-btn opt-btn" style="width: 100%; margin: 5px 0 12px 0;">
                <i class="fa-solid fa-circle-notch"></i> 최적화 모드: OFF (애니메이션 켜짐)
            </button>

            <div class="controls" style="margin-bottom: 12px;">
                <button onclick="setSort('newest')" class="winter-btn">최신 순</button>
                <button onclick="setSort('oldest')" class="winter-btn">오래된 순</button>
                <button onclick="resetFilter()" class="winter-btn">초기화</button>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" class="winter-input search-input-field" placeholder="빛의 기록의 제목을 검색해보세요..." oninput="searchTitle(this.value)">
                </div>
            </div>

            <button id="global-mailbox-btn" onclick="handleMailboxClick()" class="winter-btn main-mailbox-trigger visitor-mailbox-theme" style="width: 100%; margin: 10px 0 0 0;">
                <i class="fa-solid fa-paper-plane"></i> 하은이에게 편지 쓰기
            </button>
            
        </div>

        <div id="admin-wrapper" style="display: none;">
            <button id="admin-open-toggle" onclick="toggleAdminForm()" class="admin-write-toggle-btn">
                <i class="fa-solid fa-pen-to-square"></i> 기록자 글쓰기 판넬 열기
            </button>

            <div id="admin-area" style="display: none;">
                <h3 id="admin-panel-title" class="admin-title"><i class="fa-solid fa-feather"></i> 우주에 새로운 빛의 기록 남기기</h3>
                <input type="hidden" id="edit-id">
                
                <div style="margin-bottom: 16px;">
                    <input type="text" id="new-title" class="admin-input" placeholder="기록할 제목을 입력하세요.">
                </div>

                <div style="margin-bottom: 16px;">
                    <input type="password" id="new-password" class="admin-input" maxlength="4" 
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');" 
                           placeholder="🔒 숫자 4자리 암호 설정 (비워두면 일반 공개글)">
                </div>

                <div style="margin-bottom: 20px;">
                    <textarea id="new-content" class="admin-input" rows="7" placeholder="우주 너머에 남길 문장들을 입력하세요."></textarea>
                </div>

                <div class="admin-btn-group">
                    <button onclick="toggleAdminForm()" class="admin-cancel-btn" style="flex:1;">취소</button>
                    <button id="admin-main-btn" onclick="savePost()" class="admin-submit-btn" style="flex:2;">
                        <i class="fa-solid fa-feather"></i> 기록 새겨넣기
                    </button>
                </div>
            </div>
        </div>

        <div class="feed-utility-bar">
            <span class="feed-title-sub"><i class="fa-solid fa-stars"></i> 빛의 기록들</span>
            <a href="#" onclick="enterAdminMode(event)" class="admin-gate-link"><i class="fa-solid fa-gear"></i> 관리자 페이지로 가기</a>
        </div>

        <div id="post-list"></div>

        <div class="pagination">
            <button onclick="prevPage()" class="page-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="page-indicator">1</span>
            <button onclick="nextPage()" class="page-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <div id="reply-modal" class="reply-modal-overlay" style="display: none;">
        <div class="reply-modal-content" style="max-width: 440px; width: 90%;">
            <h3 id="modal-form-title">하은이에게 편지 보내기</h3>
            <p id="modal-form-desc" class="reply-target-info"></p>
            
            <div id="mailbox-admin-view" style="display: none; margin-bottom: 15px;">
                <div class="mailbox-controls">
                    <input type="text" id="mailbox-search" class="winter-input" placeholder="작성자 검색..." oninput="filterMailbox()">
                </div>
                <div id="mailbox-letters-list" class="mailbox-scroll-area"></div>
                <div class="mailbox-pagination">
                    <button onclick="moveMailboxPage(-1)" class="mailbox-page-btn">이전</button>
                    <span id="mailbox-page-indicator">1 / 1</span>
                    <button onclick="moveMailboxPage(1)" class="mailbox-page-btn">다음</button>
                </div>
            </div>

            <div id="mailbox-user-form">
                <div style="margin-top: 15px; margin-bottom: 12px;">
                    <input type="text" id="reply-author" class="admin-input" placeholder="보내는 이 이름" style="margin-bottom:0;">
                </div>
                <div style="margin-bottom: 18px;">
                    <textarea id="reply-content" class="admin-input" rows="5" placeholder="마음을 실어 보낼 이야기를 채워주세요." style="margin-bottom:0;"></textarea>
                </div>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                <button onclick="closeReplyModal()" class="winter-btn" style="margin:0; background:rgba(255,255,255,0.1);">닫기</button>
                <button id="reply-submit-btn" onclick="submitLetterOrReply()" class="winter-btn" style="margin:0; background:rgba(245,230,200,0.2); border-color:#F5E6C8; color:#F5E6C8; font-weight:bold;">전송하기</button>
            </div>
        </div>
    </div>

    <div id="snow-container"></div>
    <div id="easter-stars-container"></div>
    <div id="easter-egg-message" class="easter-message-box">🌌 우주의 별들이 당신을 축복합니다 🌌</div>

    <script type="module" src="script.js"></script>
</body>
</html>
