<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 사랑하는 우주에게</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="space-background">
        <div class="star-universe"></div>
    </div>

    <div id="easter-stars-container"></div>
    <div id="easter-message" class="easter-message-box">✨ 너는 나만의 소중한 우주야 ✨</div>

    <div id="wrap">
        
        <h1 class="main-title" onclick="triggerUniverseEasterEgg()">
            <span>나의 사랑하는</span>
            <span>우주에게</span>
        </h1>

        <div class="ui-container">
            <div class="triple-row">
                <button class="btn-base active" id="sort-latest" onclick="changeSort('latest')">최신 순</button>
                <button class="btn-base" id="sort-oldest" onclick="changeSort('oldest')">오래된 순</button>
                <button class="btn-base" onclick="resetFilters()">초기화</button>
            </div>

            <input type="text" id="search-title" class="btn-base search-input" placeholder="빛의 기록의 제목을 검색해보세요..." oninput="changePage(1)">

            <button class="btn-base write-btn" id="user-write-btn" onclick="openModal('writeModal')">
                🚀 하은이에게 편지 쓰기
            </button>

            <button class="btn-base write-btn" id="admin-write-btn" onclick="openModal('writeModal')" style="display: none; border-color: #FFE6BA; color: #FFE6BA;">
                ✍️ 관리자 권한 글 쓰기
            </button>
        </div>

        <div class="mailbox-container">
            <div id="mailbox-status-title" class="mailbox-status-text">🌌 별빛 우체통</div>
            
            <button class="admin-entry-btn" onclick="openModal('adminAuthModal')">관리자 모드 진입</button>
            
            <div id="posts-mailbox-feed"></div>
        </div>

        <div class="pagination" id="pagination-control"></div>

    </div>

    <div id="adminAuthModal" class="modal-overlay">
        <div class="modal-window">
            <h3>관리자 보안 인증</h3>
            <input type="password" id="admin-password-input" placeholder="비밀번호를 입력하세요...">
            <div class="modal-buttons">
                <button class="submit-btn" onclick="checkAdminPassword()">인증</button>
                <button class="cancel-btn" onclick="closeModal('adminAuthModal')">취소</button>
            </div>
        </div>
    </div>

    <div id="adminNameModal" class="modal-overlay">
        <div class="modal-window">
            <h3>관리자 활동명 설정</h3>
            <p style="font-size:0.85rem; color:#aaa; text-align:center;">게시글 작성 시 표시될 이름을 입력하세요.</p>
            <input type="text" id="admin-name-input" placeholder="예: 하은, SYSTEM">
            <div class="modal-buttons">
                <button class="submit-btn" onclick="saveAdminProfile()">설정 완료</button>
            </div>
        </div>
    </div>

    <div id="writeModal" class="modal-overlay">
        <div class="modal-window">
            <h3 id="write-modal-title">나의 우주에게 편지 쓰기</h3>
            <input type="text" id="post-author" placeholder="작성자 이름 (비어있을 시 익명)">
            <input type="text" id="post-title" placeholder="빛의 기록 제목">
            <textarea id="post-content" placeholder="이곳에 따스한 마음을 남겨주세요..."></textarea>
            <div class="modal-buttons">
                <button class="submit-btn" onclick="submitPost()">보내기</button>
                <button class="cancel-btn" onclick="closeModal('writeModal')">닫기</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
