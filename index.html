<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별빛 우체통</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="space-background">
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <div id="easter-stars-container"></div>
    <div id="easter-message"></div>

    <div class="wrapper">
        <header>
            <h1 id="mailbox-status-title" onclick="triggerUniverseEasterEgg()">🌌 별빛 우체통</h1>
            
            <div class="header-buttons">
                <button class="notice-open-btn" onclick="toggleNoticeLetters()">📢 공지사항 모아보기</button>
                <button class="recent-open-btn" onclick="toggleRecentLetters()">🆕 최근 글 모아보기</button> 
                <button class="admin-entry-btn" onclick="openModal('adminAuthModal')">관리자 인증</button>
            </div>
        </header>

        <div class="filter-zone">
            <input type="text" id="search-title" placeholder="제목으로 기록 검색..." oninput="renderPosts()">
            <div class="sort-buttons">
                <button id="sort-latest" class="active" onclick="changeSort('latest')">최신순</button>
                <button id="sort-oldest" onclick="changeSort('oldest')">과거순</button>
                <button onclick="resetFilters()">초기화</button>
            </div>
        </div>

        <main id="posts-mailbox-feed"></main>

        <div id="pagination-control" class="pagination-container"></div>

        <div class="bottom-actions">
            <button id="user-write-btn" onclick="openModal('writeModal')"> 하은이에게 편지 쓰기 ✉️</button>
            <button id="admin-write-btn" style="display:none;" onclick="openModal('writeModal')">별빛 기록 기록하기 ✍️</button>
            <div id="secret-mailbox-icon" style="display:none;" onclick="toggleSecretLetters()">📨</div>
        </div>
    </div>

    <div id="writeModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="write-modal-title">편지 쓰기</h2>
                <button class="close-btn" onclick="closeModal('writeModal')">×</button>
            </div>
            <div class="modal-body">
                <input type="text" id="post-author" placeholder="작성자 이름">
                <input type="text" id="post-title" placeholder="제목을 입력하세요">
                <textarea id="post-content" placeholder="우주에 새길 내용을 적어주세요..."></textarea>
                
                <div id="admin-notice-zone" style="display:none; flex-direction:column; gap:10px; margin-top:10px;">
                    <input type="password" id="post-password" placeholder="🔒 글 잠금 비밀번호 (선택)">
                    <label style="color:#FFE6BA; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; gap:5px;">
                        <input type="checkbox" id="post-is-pinned"> 📌 이 기록을 공지사항으로 고정합니다.
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="submit-btn" onclick="submitPost()">우주로 보내기 ✨</button>
            </div>
        </div>
    </div>

    <div id="adminAuthModal" class="modal-overlay">
        <div class="modal-content mini-modal">
            <div class="modal-header">
                <h2>관리자 인증</h2>
                <button class="close-btn" onclick="closeModal('adminAuthModal')">×</button>
            </div>
            <div class="modal-body">
                <input type="password" id="admin-password-input" placeholder="비밀번호를 입력하세요">
            </div>
            <div class="modal-footer">
                <button class="submit-btn" onclick="checkAdminPassword()">확인</button>
            </div>
        </div>
    </div>

    <div id="adminNameModal" class="modal-overlay">
        <div class="modal-content mini-modal">
            <div class="modal-header">
                <h2>프로필 설정</h2>
            </div>
            <div class="modal-body">
                <input type="text" id="admin-name-input" placeholder="표시될 관리자 이름">
            </div>
            <div class="modal-footer">
                <button class="submit-btn" onclick="saveAdminProfile()">저장하고 입장</button>
            </div>
        </div>
    </div>

    <div id="secretMailboxModal" class="modal-overlay">
        <div class="modal-content secret-window">
            <div class="modal-header">
                <h2>도착한 비밀 편지함 📨</h2>
                <button class="close-btn" onclick="closeModal('secretMailboxModal')">×</button>
            </div>
            <div class="secret-tabs">
                <button id="secret-tab-all" class="active" onclick="changeSecretTab('all')">모든 편지</button>
                <button id="secret-tab-fav" onclick="changeSecretTab('fav')">즐겨찾기 ★</button>
            </div>
            <div id="secret-letters-container" class="secret-scroll-zone"></div>
        </div>
    </div>

    <div id="noticeMailboxModal" class="modal-overlay">
        <div class="modal-content secret-window">
            <div class="modal-header">
                <h2>📢 별빛 공지사항 모음</h2>
                <button class="close-btn" onclick="closeModal('noticeMailboxModal')">×</button>
            </div>
            <div id="notice-letters-container" class="secret-scroll-zone"></div>
        </div>
    </div>

    <div id="recentMailboxModal" class="modal-overlay">
        <div class="modal-content secret-window">
            <div class="modal-header">
                <h2>🆕 최근 도착한 별빛 기록 (5개)</h2>
                <button class="close-btn" onclick="closeModal('recentMailboxModal')">×</button>
            </div>
            <div id="recent-letters-container" class="secret-scroll-zone"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
