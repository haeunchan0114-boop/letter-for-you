<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 기록소</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 기본 레이아웃 스타일 (필요에 따라 본인의 CSS 파일로 분리하셔도 됩니다) */
        body { margin: 0; font-family: sans-serif; background: #0b0f19; color: #fff; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .winter-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px 20px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .winter-btn:hover { background: rgba(255,255,255,0.2); }
        .post-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; margin-bottom: 20px; position: relative; }
        .post-card.pinned { border-color: #f6ad55; }
        .post-date { font-size: 0.85rem; color: #a0aec0; margin-bottom: 10px; }
        .post-title { margin: 0 0 10px 0; font-size: 1.5rem; color: #F5E6C8; }
        .admin-card-controls { display: none !important; gap: 8px; margin-top: 15px; justify-content: flex-end; }
        .admin-mini-btn { background: rgba(0,0,0,0.3); border: 1px solid #4a5568; color: #cbd5e0; padding: 4px 8px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; }
        .admin-mini-btn.del-btn { border-color: #e53e3e; color: #fc8181; }
        .admin-mini-btn.pin-active { background: #f6ad55; color: #000; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; z-index:1000; }
        .modal-content { background:#1a202c; padding:25px; border-radius:12px; max-width:400px; width:90%; border:1px solid #4a5568; }
        .input-style { width: 100%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid #4a5568; color: #fff; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <button id="global-mailbox-btn" onclick="handleMailboxClick()" class="winter-btn visitor-mailbox-theme">
                <i class="fa-solid fa-paper-plane"></i> 하은이에게 편지 쓰기
            </button>
            <button id="opt-toggle-btn" onclick="toggleOptimization()" class="winter-btn">
                <i class="fa-solid fa-gauge-high"></i> 최적화 모드: OFF (애니메이션 켜짐)
            </button>
        </div>

        <div id="admin-wrapper" style="display: none; margin-bottom: 30px;">
            <button id="admin-open-toggle" onclick="toggleAdminForm()" class="winter-btn" style="background: #2b6cb0;">
                <i class="fa-solid fa-pen-to-square"></i> 기록자 글쓰기 판넬 열기
            </button>

            <div id="admin-area" style="display: none; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; border: 1px solid #2b6cb0;">
                <h3 id="admin-panel-title" style="margin-top:0; color:#F5E6C8;">우주에 새로운 빛의 기록 남기기</h3>
                <input type="hidden" id="edit-id">
                
                <div style="margin-bottom: 12px;">
                    <label style="display:block; margin-bottom:5px; font-size:0.9rem; color:#cbd5e0;">글 제목</label>
                    <input type="text" id="new-title" class="input-style" placeholder="기록할 제목을 적어주세요.">
                </div>

                <div style="margin-bottom: 12px;">
                    <label for="new-password" style="display:block; margin-bottom:5px; font-size:0.9rem; color:#cbd5e0;">
                        <i class="fa-solid fa-lock"></i> 글 비밀번호 설정 (선택)
                    </label>
                    <input type="password" id="new-password" class="input-style" maxlength="4" 
                           oninput="this.value = this.value.replace(/[^0-8-9]/g, '');" 
                           placeholder="숫자 4자리 입력 (비워두면 누구나 읽을 수 있는 공개글이 됩니다)">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; font-size:0.9rem; color:#cbd5e0;">기록 내용</label>
                    <textarea id="new-content" class="input-style" rows="6" placeholder="우주 너머에 남길 문장들을 입력하세요."></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button id="admin-main-btn" onclick="savePost()" class="winter-btn" style="background:#2b6cb0;">
                        <i class="fa-solid fa-feather"></i> 우주에 빛의 기록 새겨넣기
                    </button>
                    <button onclick="toggleAdminForm()" class="winter-btn" style="background:#4a5568;">취소</button>
                </div>
            </div>
        </div>

        <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.1); margin: 30px 0;">

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="search-input" class="input-style" placeholder="기록 제목 검색..." oninput="searchTitle(this.value)">
            <button onclick="setSort('newest')" class="winter-btn">최신순</button>
            <button onclick="setSort('oldest')" class="winter-btn">오래된순</button>
            <button onclick="resetFilter()" class="winter-btn"><i class="fa-solid fa-rotate-right"></i></button>
        </div>

        <div id="post-list"></div>

        <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px;">
            <button onclick="prevPage()" class="winter-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <span>페이지: <strong id="page-indicator">1</strong></span>
            <button onclick="nextPage()" class="winter-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <div id="reply-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-form-title" style="margin-top:0; color:#F5E6C8;">하은이에게 편지 보내기</h3>
            <p id="modal-form-desc" style="font-size:0.85rem; color:#a0aec0; margin-bottom:15px;"></p>
            <div style="margin-bottom:12px;">
                <input type="text" id="reply-author" class="input-style" placeholder="보내는 이 이름">
            </div>
            <div style="margin-bottom:15px;">
                <textarea id="reply-content" class="input-style" rows="4" placeholder="마음을 실어 보낼 이야기를 채워주세요."></textarea>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button onclick="submitLetterOrReply()" class="winter-btn" style="background:#2b6cb0;">전송</button>
                <button onclick="closeReplyModal()" class="winter-btn">닫기</button>
            </div>
        </div>
    </div>

    <div id="snow-container" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:99; overflow:hidden;"></div>
    <div id="easter-stars-container" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:98; overflow:hidden;"></div>
    <div id="easter-egg-message" style="position:fixed; top:20%; left:50%; transform:translate(-50%, -50%); background:rgba(0,0,0,0.8); padding:15px 30px; border-radius:30px; border:1px solid #F5E6C8; color:#F5E6C8; font-weight:bold; pointer-events:none; z-index:999; display:none; opacity:0; transition:all 0.5s;">🌌 우주의 별들이 당신을 축복합니다 🌌</div>

    <script src="script.js"></script>
</body>
</html>
