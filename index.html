<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별빛 우체통 (Starry Mailbox)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="easter-stars-container"></div>
    <div id="easter-message"></div>

    <div class="universe-bg">
        <div class="stars"></div>
        <div class="twinkling"></div>
        
        <div class="main-container">
            <header class="main-header">
                <h1 onclick="triggerUniverseEasterEgg()">🌌 STARRY SPACE</h1>
                <p>우주의 파편 속에서 서로의 별빛을 찾아보세요</p>
            </header>

            <div class="mailbox-container">
                <button class="admin-entry-btn" onclick="openModal('adminAuthModal')">관리자 인증</button>

                <div class="mailbox-header">
                    <div class="mailbox-status-text" id="mailbox-status-title">🌌 별빛 우체통</div>
                    <button id="secret-mailbox-icon" class="secret-mail-icon-btn" style="display: none;" onclick="toggleSecretLetters()">📨</button>
                </div>

                <div class="filter-box">
                    <input type="text" id="search-title" placeholder="빛의 기록 제목 검색..." oninput="renderPosts()">
                    <div class="filter-buttons">
                        <button id="sort-latest" class="filter-btn active" onclick="changeSort('latest')">최신순</button>
                        <button id="sort-oldest" class="filter-btn" onclick="changeSort('oldest')">오래된순</button>
                        <button class="filter-btn reset-btn" onclick="resetFilters()">초기화</button>
                    </div>
                </div>
            </div>

            <main id="posts-mailbox-feed" class="feed-container"></main>

            <div id="pagination-control" class="pagination-container"></div>

            <div class="action-trigger-area">
                <button id="user-write-btn" class="write-trigger-btn" onclick="openModal('writeModal')">나의 우주에게 편지 쓰기</button>
                <button id="admin-write-btn" class="write-trigger-btn admin-theme" style="display: none;" onclick="openModal('writeModal')">✍️ 관리자 공지 기록하기</button>
            </div>
        </div>
    </div>

    <div id="adminAuthModal" class="modal-overlay">
        <div class="modal-window">
            <h3>관리자 보안 인증</h3>
            <input type="password" id="admin-password-input" placeholder="비밀번호를 입력하세요...">
            <div class="modal-buttons">
                <button class="submit-btn" onclick="checkAdminPassword()">인증</button>
                <button class="cancel-btn" onclick="closeModal('adminAuthModal')">취소</button>
            </div>
        </div>
    </div>

    <div id="adminNameModal" class="modal-overlay">
        <div class="modal-window">
            <h3>관리자 활동명 설정</h3>
            <p style="font-size:0.85rem; color:#aaa; text-align:center;">게시글 작성 시 표시될 이름을 입력하세요.</p>
            <input type="text" id="admin-name-input" placeholder="예: 하은, SYSTEM">
            <div class="modal-buttons">
                <button class="submit-btn" onclick="saveAdminProfile()">설정 완료</button>
            </div>
        </div>
    </div>

    <div id="writeModal" class="modal-overlay">
        <div class="modal-window">
            <h3 id="write-modal-title">나의 우주에게 편지 쓰기</h3>
            <input type="text" id="post-author" placeholder="작성자 이름 (비어있을 시 익명)">
            <input type="text" id="post-title" placeholder="빛의 기록 제목">
            
            <input type="password" id="post-password" placeholder="글 비밀번호 설정 (선택 사항)" style="display: none;">
            
            <textarea id="post-content" placeholder="이곳에 따스한 마음을 남겨주세요..."></textarea>
            <div class="modal-buttons">
                <button class="submit-btn" onclick="submitPost()">보내기</button>
                <button class="cancel-btn" onclick="closeModal('writeModal')">닫기</button>
            </div>
        </div>
    </div>

    <div id="secretMailboxModal" class="modal-overlay">
        <div class="modal-window secret-mailbox-window">
            <h3>📬 도착한 비밀 편지함</h3>
            <div class="secret-modal-meta">받은 편지 리스트를 확인할 수 있는 독립된 창입니다.</div>
            
            <div id="secret-letters-container" class="secret-letters-scroll-zone"></div>
            
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeModal('secretMailboxModal')">닫기</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
