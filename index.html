<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의 우주</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="space-background">
        <div class="aurora-green"></div>
        <div class="aurora-purple"></div>

        <div class="space-moon"></div>
        <div class="nebula-pink"></div>
        <div class="nebula-blue"></div>
        <div class="nebula-purple"></div>
        <div class="aurora-blue"></div>
        <div class="star-universe"></div>
        <div class="star-bright star1">✦</div>
        <div class="star-bright star2">✦</div>
        <div class="star-bright star3">✦</div>
        
        <div class="shooting-star s-star1"></div>
        <div class="shooting-star s-star2"></div>
        <div class="shooting-star s-star3"></div>
        <div class="shooting-star s-star4"></div>
        <div class="shooting-star s-star5"></div>
        <div class="shooting-star s-star6"></div>
        <div class="shooting-star s-star7"></div>
    </div>

    <div id="snow-container"></div>

    <div id="wrap">
        <h1 style="line-height: 1.4; cursor: pointer; user-select: none;" onclick="triggerSpaceEasterEgg()">
            나의 사랑하는<br>우주에게
        </h1>

        <div id="easter-egg-message" class="easter-message-box">
            너는 나만의 빛나는 우주야
        </div>

        <div id="easter-stars-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; overflow: hidden;"></div>

        <div id="admin-wrapper" style="display: none;">
            <button id="admin-open-toggle" class="admin-write-toggle-btn" onclick="toggleAdminForm()">
                <i class="fa-solid fa-star"></i> 나의 우주에게 빛을 전하러 가기
            </button>
            
            <div id="admin-area" style="display: none;">
                <h3 id="admin-panel-title" class="admin-title">새로운 우주의 기록</h3>
                <input type="hidden" id="edit-id">
                <input type="text" id="new-title" class="admin-input" placeholder="빛의 기록의 제목을 적어주세요.">
                <textarea id="new-content" class="admin-input" rows="6" placeholder="우주에 새길 빛의 이야기를 기록해 주세요."></textarea>
                <div class="admin-btn-group">
                    <button class="admin-cancel-btn" id="admin-cancel-btn" onclick="clearAdminForm(); toggleAdminForm();">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button id="admin-open-toggle" class="admin-write-toggle-btn" onclick="toggleAdminForm()">
    <i class="fa-solid fa-star"></i> 나의 우주에게 빛을 보내러 가기
</button>
                </div>
            </div>
        </div>

        <div class="controls" style="display: flex; justify-content: center; gap: 8px; width: 100%; max-width: 340px; margin: 0 auto 12px auto; box-sizing: border-box;">
            <button class="winter-btn" style="flex: 1; margin: 0; padding: 10px 0; font-size: 0.85rem; white-space: nowrap;" onclick="setSort('newest')">최신 순</button>
            <button class="winter-btn" style="flex: 1; margin: 0; padding: 10px 0; font-size: 0.85rem; white-space: nowrap;" onclick="setSort('oldest')">오래된 순</button>
            <button class="winter-btn" style="flex: 1; margin: 0; padding: 10px 0; font-size: 0.85rem; white-space: nowrap;" onclick="resetFilter()">초기화</button>
        </div>

        <div class="search-container" style="width: 100%; max-width: 340px; margin: 0 auto 12px auto; padding: 0; box-sizing: border-box;">
            <div class="search-box" style="position: relative; width: 100%; margin: 0;">
                <i class="fa-solid fa-magnifying-glass search-icon" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5);"></i>
                <input type="text" id="search-input" class="winter-input search-input-field" 
                       style="width: 100%; height: 45px; padding: 0 15px 0 40px; margin: 0; box-sizing: border-box; font-size: 0.9rem;" 
                       placeholder="빛의 기록의 제목을 검색해보세요..." oninput="searchTitle(this.value)">
            </div>
        </div>

        <div class="mailbox-container" style="width: 100%; max-width: 340px; margin: 0 auto 20px auto; padding: 0; box-sizing: border-box;">
            <button id="global-mailbox-btn" class="winter-btn main-mailbox-trigger" 
                    style="width: 100%; height: 45px; margin: 0; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; letter-spacing: 0.5px;" 
                    onclick="handleMailboxClick()">
            </button>
        </div>

        <div id="post-list"></div>

        <div class="pagination">
            <button class="page-btn" onclick="prevPage()"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="page-indicator">1</span>
            <button class="page-btn" onclick="nextPage()"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <div id="reply-modal" class="reply-modal-overlay" style="display: none;">
        <div class="reply-modal-content">
            <h3 id="modal-form-title">편지 보내기</h3>
            <p id="modal-form-desc" class="reply-target-info"></p>
            <input type="text" id="reply-author" class="admin-input" placeholder="당신의 이름(닉네임)">
            <textarea id="reply-content" class="admin-input" rows="5" placeholder="여기에 따뜻한 이야기를 적어주세요..."></textarea>
            <div class="admin-btn-group">
                <button class="winter-btn" style="flex: 1; margin: 0;" onclick="closeReplyModal()">닫기</button>
                <button class="admin-submit-btn" style="flex: 2; padding: 11px;" onclick="submitLetterOrReply()">보내기</button>
            </div>
        </div>
    </div>

    <div id="mailbox-modal" class="reply-modal-overlay" style="display: none;">
        <div class="reply-modal-content" style="max-width: 540px; width: 95%;">
            <h3>통합 우주 편지함</h3>
            <p class="reply-target-info" style="color: #F5E6C8; margin-bottom: 15px;">나에게 온 편지와 게시글 답장이 실시간으로 모두 모이는 공간입니다.</p>
            
            <div class="mailbox-tabs" style="display: flex; gap: 5px; margin-bottom: 15px;">
                <button id="tab-all" class="winter-btn" style="flex: 1; margin: 0; background: rgba(255,255,255,0.15); font-weight: bold;" onclick="switchMailboxTab('all')">전체 편지</button>
                <button id="tab-starred" class="winter-btn" style="flex: 1; margin: 0; background: none;" onclick="switchMailboxTab('starred')"><i class="fa-solid fa-star" style="color:#F5E6C8;"></i> 즐겨찾기</button>
            </div>

            <div class="mailbox-controls" style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 15px;">
                <input type="text" id="mailbox-search" class="winter-input" style="margin:0; flex:1;" placeholder="작성자 검색..." oninput="filterMailbox()">
                <input type="date" id="mailbox-date" class="winter-input" style="margin:0; flex:1; color:#ffffff !important;" onchange="filterMailbox()">
                <button class="winter-btn" style="padding: 6px 12px; font-size: 0.8rem; margin:0;" onclick="resetMailboxFilter()">초기화</button>
            </div>

            <div id="mailbox-list" class="mailbox-scroll-area"></div>
            
            <div class="mailbox-page-zone" id="mailbox-page-zone" style="display:flex; justify-content:center; align-items:center; gap:20px; margin-top:15px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.06);">
                <button class="mailbox-page-btn" onclick="prevMailboxPage()"><i class="fa-solid fa-arrow-left"></i></button>
                <span id="mailbox-page-indicator">1</span>
                <button class="mailbox-page-btn" onclick="nextMailboxPage()"><i class="fa-solid fa-arrow-right"></i></button>
            </div>

            <button class="winter-btn" style="width: 100%; margin: 15px 0 0 0;" onclick="closeMailboxModal()">편지함 닫기</button>
        </div>
    </div>

    <style>
        .mailbox-item.starred-letter {
            border: 1px solid #F5E6C8 !important;
            background: rgba(245, 230, 200, 0.05) !important;
        }
        .star-btn {
            background: none;
            border: none;
            color: #718096;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 5px;
            transition: color 0.2s;
        }
        .star-btn.active {
            color: #F5E6C8 !important;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnaa6EtIpvtCxqGPVtbuclexr2agHJWP8",
            authDomain: "myloveletter-for-you.firebaseapp.com",
            projectId: "myloveletter-for-you",
            storageBucket: "myloveletter-for-you.firebasestorage.app",
            messagingSenderId: "567184694523",
            appId: "1:567184694523:web:e5c92804e673c22b7ca45e",
            measurementId: "G-TM826Q76TT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.fbDB = db;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbPush = push;
        window.fbOnValue = onValue;
        window.fbRemove = remove;
        window.fbUpdate = update;

        // 파이어베이스 로드가 다 끝나면 스크립트 파일을 안전하게 실행하도록 트리거 발동
        if (typeof window.initApp === "function") {
            window.initApp();
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
