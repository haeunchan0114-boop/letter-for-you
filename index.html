<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 사랑하는 우주에게</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="space-background">
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <div class="wrapper">
        <div class="top-control-zone">
            <header>
                <h1 onclick="triggerUniverseEasterEgg()">나의 사랑하는<br>우주에게</h1>
                <div class="header-buttons">
                    <button class="admin-entry-btn" onclick="openModal('adminAuthModal')">관리자 인증</button>
                    <button class="recent-open-btn" onclick="toggleRecentLetters()">최근 글</button>
                    <button class="recent-open-btn" onclick="toggleNoticeLetters()">📌 공지 모음</button>
                </div>
            </header>

            <div class="filter-zone">
                <button id="optimize-btn" class="optimize-toggle-btn" onclick="toggleOptimizationMode()">
                    ⚙️ 최적화 모드: OFF (애니메이션 켜짐)
                </button>
                
                <div class="sort-buttons">
                    <button id="sort-latest" class="active" onclick="changeSort('latest')">최신 순</button>
                    <button id="sort-oldest" onclick="changeSort('oldest')">오래된 순</button>
                    <button id="sort-reset" onclick="resetFilters()">초기화</button>
                </div>
                
                <input type="text" id="search-title" placeholder="빛의 기록의 제목을 검색해보세요..." oninput="renderPosts()">

                <div class="moved-actions-zone">
                    <button id="user-write-btn" onclick="openModal('writeModal')">
                        🚀 하은이에게 편지 쓰기
                    </button>
                    <button id="admin-write-btn" style="display:none;" onclick="openModal('writeModal')">
                        ✍️ 새 공지사항 및 글 기록하기
                    </button>
                    <div id="secret-mailbox-icon" style="display:none;" onclick="toggleSecretLetters()">
                        📨 비밀 우체통 열기
                    </div>
                </div>
            </div>
        </div>

        <div id="posts-mailbox-feed" class="main-feed-zone"></div>

        <div id="pagination-control" class="pagination-container"></div>
    </div>

    <div id="writeModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="write-modal-title">하은이에게 편지 쓰기</h2>
                <button class="close-btn" onclick="closeModal('writeModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="post-author" placeholder="닉네임을 적어주세요 (미입력시 익명)">
                <input type="text" id="post-title" placeholder="반짝이는 제목을 입력하세요">
                <textarea id="post-content" placeholder="우주 너머 전하고 싶은 소중한 이야기를 담아보세요..."></textarea>
                
                <input type="password" id="post-password" placeholder="🔒 게시글 비밀번호 설정 (선택)" style="display:none;">
                <div id="admin-notice-zone" style="display:none; align-items:center; gap:8px; margin-bottom:12px; font-size:0.85rem; color:#FFE6BA;">
                    <input type="checkbox" id="post-is-pinned" style="width:auto; margin-bottom:0; cursor:pointer;">
                    <label for="post-is-pinned" style="cursor:pointer; user-select:none;">📌 고정 공지사항으로 등록하기</label>
                </div>

                <button class="submit-btn" onclick="submitPost()">은하수로 띄우기</button>
            </div>
        </div>
    </div>

    <div id="adminAuthModal" class="modal-overlay">
        <div class="modal-content mini-modal">
            <div class="modal-header">
                <h2>관리자 우주 주파수 맞추기</h2>
                <button class="close-btn" onclick="closeModal('adminAuthModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="password" id="admin-password-input" placeholder="비밀 코드를 입력하세요" onkeydown="handleAdminAuthEnter(event)">
                <button class="submit-btn" onclick="checkAdminPassword()">주파수 연결</button>
            </div>
        </div>
    </div>

    <div id="adminNameModal" class="modal-overlay">
        <div class="modal-content mini-modal">
            <div class="modal-header">
                <h2>식별 호칭 등록</h2>
            </div>
            <div class="modal-body">
                <input type="text" id="admin-name-input" placeholder="화면에 표시될 관리자 이름" onkeydown="handleAdminNameEnter(event)">
                <button class="submit-btn" onclick="saveAdminProfile()">프로필 저장</button>
            </div>
        </div>
    </div>

    <div id="secretMailboxModal" class="modal-overlay">
        <div class="modal-content secret-window">
            <div class="modal-header">
                <h2 id="mailbox-status-title">🌌 별빛 우체통</h2>
                <button class="close-btn" onclick="closeModal('secretMailboxModal')">&times;</button>
            </div>
            <div class="secret-tabs">
                <button id="secret-tab-all" class="active" onclick="changeSecretTab('all')">받은 편지 전체</button>
                <button id="secret-tab-fav" onclick="changeSecretTab('fav')">별표 소중한 기록 (★)</button>
            </div>
            <div id="secret-letters-container" class="secret-scroll-zone"></div>
        </div>
    </div>

    <div id="noticeMailboxModal" class="modal-overlay">
        <div class="modal-content secret-window">
            <div class="modal-header">
                <h2>📌 고정된 별빛 공지사항 전체보기</h2>
                <button class="close-btn" onclick="closeModal('noticeMailboxModal')">&times;</button>
            </div>
            <div id="notice-letters-container" class="secret-scroll-zone" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="recentMailboxModal" class="modal-overlay">
        <div class="modal-content secret-window">
            <div class="modal-header">
                <h2>📜 실시간 최근 등록 기록 (5개)</h2>
                <button class="close-btn" onclick="closeModal('recentMailboxModal')">&times;</button>
            </div>
            <div id="recent-letters-container" class="secret-scroll-zone" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="easter-message"></div>
    <div id="easter-stars-container"></div>

    <script src="script.js"></script>
</body>
</html>
