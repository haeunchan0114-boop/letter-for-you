<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사랑하는 나의 우주에게 ⭐</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="space-background">
        <div class="space-moon"></div>
        
        <div class="nebula-pink"></div>
        <div class="nebula-blue"></div>

        <div class="aurora-green"></div>
        <div class="aurora-purple"></div>
        
        <div class="star-universe"></div>
        <div class="twinkle-stars">
            <div class="star-bright star1">✦</div>
            <div class="star-bright star2">✦</div>
            <div class="star-bright star3">✦</div>
            <div class="star-bright star4">✦</div>
        </div>
        
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <div id="snow-container"></div>

    <div id="wrap">
        <header>
            <h1>사랑하는 나의 우주에게 ⭐</h1>
            
            <div class="controls">
                <button class="winter-btn" onclick="setSort('newest')">
                    <i class="fa-solid fa-arrow-down-short-wide"></i> 최신순
                </button>
                <button class="winter-btn" onclick="setSort('oldest')">
                    <i class="fa-solid fa-arrow-up-wide-short"></i> 오래된순
                </button>
                <div class="date-group">
                    <input type="date" id="date-picker" class="winter-input" onchange="filterDate(this.value)">
                    <button class="winter-btn" onclick="resetFilter()">전체보기</button>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" class="winter-input search-input-field" placeholder="기록의 제목을 검색해 보세요..." oninput="searchTitle(this.value)">
                </div>
            </div>
        </header>

        <div id="admin-wrapper" style="display: none;">
            <button type="button" id="admin-open-toggle" onclick="toggleAdminForm()" class="admin-write-toggle-btn">
                <i class="fa-solid fa-pen-fancy"></i> ✍️ 새로운 기록 남기기
            </button>

            <div id="admin-area" style="display: none;">
                <h3 class="admin-title" id="admin-panel-title">✍️ 새로운 우주의 기록 (관리자)</h3>
                <input type="hidden" id="edit-index" value=""> 
                
                <input type="text" id="new-title" class="admin-input" placeholder="기록의 제목을 입력하세요">
                <input type="date" id="new-date" class="admin-input">
                <textarea id="new-content" class="admin-input" placeholder="우주에게 전할 이야기를 적으세요..." rows="6"></textarea>
                
                <div class="admin-btn-group">
                    <button type="button" id="admin-main-btn" onclick="savePost()" class="admin-submit-btn">
                        <i class="fa-solid fa-star"></i> ⭐ 나의 우주에게 빛을 전하기
                    </button>
                    <button type="button" id="admin-cancel-btn" onclick="clearAdminForm(); toggleAdminForm();" class="admin-cancel-btn">
                        닫기
                    </button>
                </div>
            </div>
        </div>

        <main id="post-list"></main>

        <div class="pagination">
            <button class="page-btn" onclick="prevPage()">
                <i class="fa-solid fa-chevron-left"></i> 이전
            </button>
            <span id="page-indicator">1</span>
            <button class="page-btn" onclick="nextPage()">
                다음 <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
