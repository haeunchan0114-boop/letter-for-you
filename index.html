<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 사랑하는 우주에게</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="space-background">
        <div class="space-moon"></div>
        <div class="nebula-pink"></div>
        <div class="nebula-blue"></div>
        <div class="nebula-purple"></div>
        <div class="aurora-green"></div>
        <div class="aurora-purple"></div>
        <div class="aurora-blue"></div>
        <div class="star-universe"></div>
        <div class="star-bright star1">✦</div>
        <div class="star-bright star2">✦</div>
        <div class="star-bright star3">✦</div>
        <div class="star-bright star4">✦</div>
        <div class="star-bright star5">✦</div>
        <div class="star-bright star6">✦</div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <div id="snow-container"></div>

    <div id="wrap">
        <h1>나의 사랑하는 우주에게</h1>

        <div id="admin-wrapper" style="display: none;">
            <button id="admin-open-toggle" class="admin-write-toggle-btn" onclick="toggleAdminForm()">
                <i class="fa-solid fa-star"></i> ⭐나의 우주에게 빛을 주러가기⭐
            </button>
            
            <div id="admin-area" style="display: none;">
                <h3 id="admin-panel-title" class="admin-title">새로운 우주의 빛나는 기록</h3>
                <input type="hidden" id="edit-index">
                <input type="text" id="new-title" class="admin-input" placeholder="빛의 제목을 적어주세요.">
                <textarea id="new-content" class="admin-input" rows="6" placeholder="우주에 새길 이야기를 기록해 주세요."></textarea>
                <div class="admin-btn-group">
                    <button class="admin-cancel-btn" id="admin-cancel-btn" onclick="clearAdminForm(); toggleAdminForm();">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button id="admin-main-btn" class="admin-submit-btn" onclick="savePost()">
                        <i class="fa-solid fa-star"></i> 나의 우주에게 빛을 보내기
                    </button>
                </div>
            </div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" class="winter-input search-input-field" placeholder="빛의 제목을 검색해보세요..." oninput="searchTitle(this.value)">
            </div>
        </div>

        <div class="controls">
            <button class="winter-btn" onclick="setSort('newest')">최신 정렬</button>
            <button class="winter-btn" onclick="setSort('oldest')">과거 정렬</button>
            <div class="date-group">
                <input type="date" id="date-picker" class="winter-input" onchange="filterDate(this.value)">
                <button class="winter-btn" onclick="resetFilter()">초기화</button>
            </div>
        </div>

        <div id="post-list"></div>

        <div class="pagination">
            <button class="page-btn" onclick="prevPage()"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="page-indicator">1</span>
            <button class="page-btn" onclick="nextPage()"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div> <div id="reply-modal" class="reply-modal-overlay" style="display: none;">
        <div class="reply-modal-content">
            <h3>✉️ 이 기록에 답장 보내기</h3>
            <p id="reply-target-title" class="reply-target-info"></p>
            <input type="text" id="reply-author" class="admin-input" placeholder="당신의 이름(닉네임)">
            <textarea id="reply-content" class="admin-input" rows="5" placeholder="따뜻한 답장을 별빛에 실어 보내세요..."></textarea>
            <div class="admin-btn-group">
                <button class="winter-btn" style="flex: 1; margin: 0;" onclick="closeReplyModal()">닫기</button>
                <button class="admin-submit-btn" style="flex: 2; padding: 11px;" onclick="submitReply()">빛의 답장 보내기</button>
            </div>
        </div>
    </div>

    <div id="mailbox-modal" class="reply-modal-overlay" style="display: none;">
        <div class="reply-modal-content" style="max-width: 520px; width: 95%;">
            <h3>📬 도착한 우주 편지함</h3>
            <p id="mailbox-target-title" class="reply-target-info" style="color: #F5E6C8; margin-bottom: 15px;"></p>
            
            <div class="mailbox-controls">
                <input type="text" id="mailbox-search" class="winter-input" placeholder="작성자 검색..." oninput="filterMailbox()">
                <input type="date" id="mailbox-date" class="winter-input" onchange="filterMailbox()">
                <button class="winter-btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="resetMailboxFilter()">초기화</button>
            </div>

            <div id="mailbox-list" class="mailbox-scroll-area"></div>
            
            <div class="mailbox-pagination" id="mailbox-page-zone">
                <button class="mailbox-page-btn" onclick="prevMailboxPage()"><i class="fa-solid fa-arrow-left"></i></button>
                <span id="mailbox-page-indicator">1</span>
                <button class="mailbox-page-btn" onclick="nextMailboxPage()"><i class="fa-solid fa-arrow-right"></i></button>
            </div>

            <button class="winter-btn" style="width: 100%; margin: 15px 0 0 0;" onclick="closeMailboxModal()">우주 편지함 닫기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
