<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사랑하는 나의 우주에게 ⭐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="snow-container"></div>
        <div class="loading-text">밤바다에 눈이 내리는 중...</div>
    </div>

    <div id="stars-background"></div>

    <div id="wrap">
        <header>
            <h1>사랑하는 나의 우주에게 ⭐</h1>
            <div class="controls">
                <button class="winter-btn" onclick="setSort('newest')">최신순</button>
                <button class="winter-btn" onclick="setSort('oldest')">오래된순</button>
                <input type="date" id="date-picker" class="winter-input" onchange="filterDate(this.value)">
                <button class="winter-btn" onclick="resetFilter()">전체보기</button>
            </div>
        </header>

        <div id="admin-area" style="display: none;">
            <h3>✍️ 새로운 글 남기기 (관리자 전용)</h3>
            <input type="text" id="new-title" placeholder="글 제목">
            <input type="date" id="new-date">
            <textarea id="new-content" placeholder="우주에게 전할 이야기..." rows="5"></textarea>
            <button onclick="generateCode()" class="winter-btn admin-active">저장용 코드 생성</button>
            <div id="code-output-box" style="display:none;">
                <textarea id="code-output" readonly></textarea>
            </div>
        </div>

        <main id="post-list"></main>

        <div class="pagination">
            <button class="page-btn" onclick="prevPage()">⟨ 이전</button>
            <span id="page-indicator">1</span>
            <button class="page-btn" onclick="nextPage()">다음 ⟩</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
